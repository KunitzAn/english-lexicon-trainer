  <style>
    body { margin: 0; background: #111310; color: #ece7dc; font-family: system-ui, -apple-system, sans-serif; }
    body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.06;

    .disp { font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    @keyframes twinkle { 0%,100% { opacity: 0.22; transform: scale(0.8); } 50% { opacity: 0.9; transform: scale(1); } }
