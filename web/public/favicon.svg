      <stop offset="0" stop-color="#22d9b3"/>
      <stop offset="1" stop-color="#12b090"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="42%">
      <stop offset="0" stop-color="#22d9b3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d9b3" stop-opacity="0"/>
