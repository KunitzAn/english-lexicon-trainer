<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111310" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#efe9dc" />
    <title>English Lexicon Trainer</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="lexicon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap"
    />

    <!-- заглушка до монтирования Vue: не белый экран при запуске PWA -->
    <style>
      html,
      body {
        margin: 0;
        background: #111310;
      }
      #app {
        min-height: 100dvh;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        background: #111310;
      }
      .boot svg {
        width: 76px;
        height: 76px;
        animation: bootPulse 1.7s ease-in-out infinite;
      }
      .boot span {
        font: 600 0.95rem/1 system-ui, -apple-system, sans-serif;
        letter-spacing: 0.16em;
        text-transform: lowercase;
        color: #6f6d61;
      }
      @keyframes bootPulse {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(0.95);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot svg {
          animation: none;
          opacity: 1;
        }
      }
      @media (prefers-color-scheme: light) {
        html,
        body,
        .boot {
          background: #efe9dc;
        }
        .boot span {
          color: #938b74;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" aria-hidden="true">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#22d9b3" />
              <stop offset="1" stop-color="#12b090" />
            </linearGradient>
            <radialGradient id="bgl" cx="50%" cy="46%" r="46%">
              <stop offset="0" stop-color="#22d9b3" stop-opacity="0.22" />
              <stop offset="1" stop-color="#22d9b3" stop-opacity="0" />
            </radialGradient>
          </defs>
          <circle cx="256" cy="256" r="220" fill="url(#bgl)" />
          <path d="M206,176 L306,176 L256,368 Z" fill="url(#bg1)" />
          <path d="M206,176 L306,176 L256,368 Z" fill="#fff" opacity="0.22" />
          <path d="M146,232 L206,176 L256,368 Z" fill="url(#bg1)" />
          <path d="M146,232 L206,176 L256,368 Z" fill="#000" opacity="0.24" />
          <path d="M306,176 L366,232 L256,368 Z" fill="url(#bg1)" />
          <path
            d="M206,176 L306,176 L366,232 L256,368 L146,232 Z"
            fill="none"
            stroke="#04231d"
            stroke-width="5"
            stroke-linejoin="round"
            opacity="0.55"
          />
          <path
            d="M206,176 L256,368 M306,176 L256,368"
            stroke="#04231d"
            stroke-width="4"
            opacity="0.4"
            stroke-linecap="round"
          />
          <line
            x1="230"
            y1="192"
            x2="204"
            y2="226"
            stroke="#fff"
            stroke-width="7"
            stroke-linecap="round"
            opacity="0.4"
          />
        </svg>
        <span>lexicon</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
